name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Check the workflows themselves
        # A workflow that is syntactically valid YAML can still be wrong in the
        # ways that matter: a tag trigger that never matches, a missing
        # `id-token: write`, a publish job that does not depend on the build.
        # Neither is visible to pytest, and a publish bug found on a tag push
        # is a bad time to find it.
        run: |
          uv run python tools/check_workflows.py
          uv run python tools/check_embedded_python.py

      - name: Test
        run: uv run pytest --cov=pypilot --cov-report=term-missing --cov-report=xml

      - name: Verify the zero-runtime-dependency claim
        # §12 requires zero third-party runtime dependencies, because the
        # interpreter has to run on a classroom Raspberry Pi. Nothing in the
        # test suite can catch an accidental `dependencies = [...]` because the
        # dev environment already has everything, so check the built metadata.
        run: |
          uv run python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))
          deps = data['project'].get('dependencies', [])
          assert not deps, f'runtime dependencies must be empty, found {deps}'
          print('no runtime dependencies')
          "

      - name: Build
        run: uv build

      - name: Check the install step is portable
        # The step below broke on Windows twice: `dist/*.whl` was not
        # glob-expanded, and `||` is a bash construct PowerShell rejects. This
        # asserts the properties that make the fixed version work, and installs
        # the wheel for real. Needs the Build step, hence the position.
        run: uv run python tools/check_wheel_install_step.py

      - name: Check the wheel installs and runs in a clean environment
        # Building is not the same as being installable, and `uv sync` has
        # already installed the project from source - so a broken wheel would
        # sail through every other step here.
        #
        # `shell: bash` is the important part. The default shell is PowerShell on
        # Windows, and two things break there: `dist/*.whl` is passed to `uv`
        # literally rather than glob-expanded, and `||` is a bash construct that
        # PowerShell rejects outright. Git Bash ships on every Windows runner,
        # so asking for bash makes one script work on all three platforms.
        shell: bash
        run: |
          uv venv .venv-wheel --python ${{ matrix.python-version }}
          # Glob here, not before: `uv pip install` needs one concrete filename,
          # and the shell is what expands the pattern.
          uv pip install --python .venv-wheel dist/*.whl
          # `uv run` would re-resolve against the project, defeating the point of
          # a clean venv. Invoke the script directly instead.
          if [ -x .venv-wheel/bin/pypilot ]; then PYPILOT=.venv-wheel/bin/pypilot;
          else PYPILOT=.venv-wheel/Scripts/pypilot.exe; fi
          "$PYPILOT" --version
          printf 'T:HELLO FROM THE INSTALLED WHEEL\n' > check.pilot
          "$PYPILOT" check.pilot
          rm -rf .venv-wheel check.pilot

  pypi-sync:
    name: PyPI version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Compare pyproject.toml with PyPI
        # Fails only if PyPI is ahead of this tree; an unreleased or already
        # published version passes. Publishing itself stays in publish.yml.
        run: uv run --no-project python tools/check_pypi_sync.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build docs
        # -W makes a warning an error. The local gate does the same, so this
        # must not drift: a doc build that warns on Linux and passes locally
        # would mean one of the two is lying.
        run: uv run --group docs sphinx-build -W -b html docs docs/_build/html

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html
